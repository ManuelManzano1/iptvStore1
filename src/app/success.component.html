<section class="card success-card">
  <div class="success-content">
    <div class="success-icon">✅</div>
    <h1 class="section-title">¡Pago Realizado!</h1>
    <p class="subtitle">Tu pago se ha realizado correctamente.</p>

    <div class="order-details" *ngIf="orderId">
      <div class="detail-item">
        <span class="detail-label">ID de pedido:</span>
        <span class="detail-value">{{ orderId }}</span>
      </div>
    </div>

    <div class="info-message">
      <p>📧 Revisa tu correo electrónico para recibir los detalles de conexión</p>
    </div>

    <a routerLink="/" class="btn-primary">← Volver a la tienda</a>
  </div>
</section>
